<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Particle Flow Field</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060c; overflow: hidden; font-family: -apple-system, sans-serif; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 14px; left: 14px; color: #cfd3ff;
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    pointer-events: none; text-shadow: 0 0 8px #000;
  }
  #ui b { color: #9df; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">Flow Field · move mouse · <b>click</b> to burst · <b>space</b> to reseed</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H;
function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
resize(); addEventListener('resize', resize);

const N = 1200;
const particles = [];
let t = 0;
let mouse = { x: -9999, y: -9999, active: false };

function seed() {
  particles.length = 0;
  for (let i = 0; i < N; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: 0, vy: 0,
      h: Math.random() * 60 + 180, // blues/purples
      life: Math.random() * 200
    });
  }
}
seed();

addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
addEventListener('mouseleave', () => { mouse.active = false; });
addEventListener('click', e => {
  for (let i = 0; i < 80; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 8 + 2;
    particles.push({
      x: e.clientX, y: e.clientY,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      h: Math.random() * 80 + 10, life: 0
    });
  }
});
addEventListener('keydown', e => { if (e.code === 'Space') seed(); });

// simple pseudo-noise flow field
function field(x, y, t) {
  const s = 0.0022;
  return (
    Math.sin(x * s + t * 0.6) +
    Math.cos(y * s * 1.3 - t * 0.4) +
    Math.sin((x + y) * s * 0.7 + t * 0.3)
  ) * Math.PI;
}

function frame() {
  t += 0.01;
  ctx.fillStyle = 'rgba(5, 6, 12, 0.08)';
  ctx.fillRect(0, 0, W, H);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const a = field(p.x, p.y, t);
    p.vx += Math.cos(a) * 0.12;
    p.vy += Math.sin(a) * 0.12;

    if (mouse.active) {
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 22500) {
        const f = 60 / (d2 + 100);
        p.vx += dx * f; p.vy += dy * f;
      }
    }

    p.vx *= 0.94; p.vy *= 0.94;
    const nx = p.x + p.vx, ny = p.y + p.vy;

    ctx.strokeStyle = `hsla(${p.h}, 90%, 65%, 0.7)`;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(nx, ny);
    ctx.stroke();

    p.x = nx; p.y = ny;
    p.life++;

    if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) {
      p.x = Math.random() * W; p.y = Math.random() * H;
      p.vx = p.vy = 0;
    }
    if (particles.length > N + 400 && p.life > 120) particles.splice(i, 1);
  }

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
